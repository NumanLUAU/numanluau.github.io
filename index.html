	<style>
		/* theme variables (--bg-top, --bg-bottom, --card-alpha, --font) are generated from Config/site.json */

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: var(--font, 'Inter'), 'Inter', sans-serif;
			min-height: 100vh;
			background: linear-gradient(to bottom, var(--bg-top, #500000), var(--bg-bottom, #ff0000));
			display: flex;
			align-items: flex-start;
			justify-content: center;
			padding: 48px 20px 64px;
		}

		.card {
			background: rgba(0, 0, 0, var(--card-alpha, 0.72));
			backdrop-filter: blur(16px);
			border-radius: 20px;
			padding: 48px;
			width: 100%;
			max-width: 1100px;
			color: #fff;
		}

		.top {
			margin-bottom: 28px;
		}

		.header {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 22px;
			margin-bottom: 28px;
		}

		.title {
			display: flex;
			flex-direction: column;
			justify-content: center;
		}

		.title h1 {
			font-size: 2.6rem;
			font-weight: 700;
			line-height: 1;
			margin-bottom: 8px;
		}

		.role {
			font-size: 0.85rem;
			color: rgba(255,255,255,0.5);
			text-transform: uppercase;
			letter-spacing: 0.1em;
		}

		.avatar {
			width: 110px;
			height: 110px;
			border-radius: 50%;
			border: 2px solid rgba(255,255,255,0.15);
			object-fit: cover;
			background: rgba(255,255,255,0.05);
		}

		/* tabs */

		.tabs {
			display: flex;
			align-items: center;
			justify-content: center;
			flex-wrap: wrap;
			width: fit-content;
			max-width: 100%;
			margin: 0 auto 32px;
			gap: 4px;
			padding: 4px;
			border: 1px solid rgba(255,255,255,0.08);
			border-radius: 10px;
			background: rgba(255,255,255,0.035);
		}

		.tab {
			border: 0;
			outline: 0;
			padding: 8px 12px;
			border-radius: 7px;
			background: transparent;
			color: rgba(255,255,255,0.5);
			font-family: inherit;
			font-size: 12px;
			font-weight: 500;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.tab:hover {
			color: rgba(255,255,255,0.85);
			background: rgba(255,255,255,0.05);
		}

		.tab.active {
			color: #fff;
			background: rgba(255,255,255,0.09);
		}

		.tab-content {
			display: none;
		}

		.tab-content.active {
			display: block;
		}

		/* text pages (home, tos, payment, and any page you add) */

		.page {
			max-width: 760px;
			margin: 0 auto;
			color: #d4d4d8;
			font-weight: 300;
			line-height: 1.7;
		}

		.page h2 {
			margin: 32px 0 12px;
			color: #f4f4f5;
			font-size: 15px;
			font-weight: 500;
			letter-spacing: 0.04em;
		}

		.page h2:first-child {
			margin-top: 0;
		}

		.page p {
			margin: 0 0 10px;
			color: #a1a1aa;
			font-size: 14px;
			font-weight: 300;
		}

		.page ul {
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.page li {
			position: relative;
			margin: 6px 0;
			padding-left: 18px;
			color: #a1a1aa;
			font-size: 14px;
			font-weight: 300;
		}

		.page li::before {
			content: "•";
			position: absolute;
			left: 0;
			color: #71717a;
		}

		.page strong {
			color: #d4d4d8;
			font-weight: 400;
		}

		.page a {
			color: #fff;
			text-decoration: underline;
			text-decoration-color: rgba(255,255,255,0.35);
			text-underline-offset: 3px;
		}

		.page a:hover {
			text-decoration-color: #fff;
		}

		.badge {
			display: inline-block;
			margin-top: 4px;
			padding: 7px 12px;
			border: 1px solid #27272a;
			border-radius: 6px;
			background: rgba(255,255,255,0.025);
			color: #d4d4d8;
			font-size: 13px;
			font-weight: 300;
		}

		/* section */

		.section-title {
			font-size: 1rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.1em;
			color: rgba(255,255,255,0.5);
			margin-bottom: 18px;
			text-align: center;
		}

		/* work */

		.video-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 18px;
			margin-bottom: 12px;
		}

		.work-item {
			width: 100%;
		}

		.video-frame {
			width: 100%;
			aspect-ratio: 16 / 9;
			border-radius: 12px;
			overflow: hidden;
			background: #050505;
			display: flex;
			align-items: center;
			justify-content: center;
			border: 1px solid rgba(255,255,255,0.06);
		}

		.video-frame video,
		.video-frame img {
			width: 100%;
			height: 100%;
			display: block;
			object-fit: contain;
			background: #050505;
		}

		.work-name {
			margin-top: 8px;
			color: rgba(255,255,255,0.55);
			font-size: 12px;
			text-align: center;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.loading,
		.empty {
			padding: 30px 0;
			text-align: center;
			color: rgba(255,255,255,0.4);
			font-size: 13px;
		}

		.grid-message {
			grid-column: 1 / -1;
		}

		/* reviews */

		.reviews-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 14px;
		}

		.review {
			display: flex;
			gap: 12px;
			padding: 16px;
			border: 1px solid rgba(255,255,255,0.08);
			border-radius: 14px;
			background: rgba(255,255,255,0.035);
			transition: background 0.15s ease;
		}

		.review:hover {
			background: rgba(255,255,255,0.055);
		}

		.review-header {
			flex-shrink: 0;
		}

		.review-pfp {
			width: 40px;
			height: 40px;
			border-radius: 50%;
			object-fit: cover;
			background: rgba(255,255,255,0.05);
			display: block;
		}

		.review-content {
			flex: 1;
			min-width: 0;
		}

		.review-name {
			display: flex;
			align-items: baseline;
			gap: 8px;
			margin-bottom: 3px;
			color: #fff;
			font-size: 13px;
			font-weight: 500;
		}

		.review-text {
			color: #a1a1aa;
			font-size: 13px;
			font-weight: 300;
			line-height: 1.7;
			white-space: pre-line;
		}

		.proof-button {
			margin-top: 10px;
			border: 1px solid #27272a;
			border-radius: 6px;
			background: rgba(255,255,255,0.03);
			color: #d4d4d8;
			padding: 7px 11px;
			font-family: inherit;
			font-size: 12px;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.proof-button:hover {
			background: rgba(255,255,255,0.08);
			border-color: #3f3f46;
			color: #fff;
		}

		.review-proof {
			display: none;
			margin-top: 10px;
			width: min(100%, 600px);
			overflow: hidden;
			border-radius: 8px;
			border: 1px solid rgba(255,255,255,0.06);
			background: rgba(0,0,0,0.15);
		}

		.review-proof.visible {
			display: block;
		}

		.review-proof img {
			display: block;
			width: 100%;
			height: auto;
			max-height: 500px;
			object-fit: contain;
		}

		/* contact */

		.contact-items {
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		.contact-item {
			display: flex;
			align-items: center;
			gap: 10px;
			color: rgba(255,255,255,0.75);
			text-decoration: none;
			font-size: 0.95rem;
			transition: color 0.2s ease;
		}

		.contact-item:hover {
			color: #fff;
		}

		.contact-icon {
			width: 22px;
			height: 22px;
			object-fit: contain;
			flex-shrink: 0;
		}

		.contact-item svg {
			flex-shrink: 0;
			opacity: 0.75;
		}

		/* setup / error message */

		.notice {
			max-width: 560px;
			margin: 0 auto;
			padding: 18px 20px;
			border: 1px solid rgba(255,255,255,0.12);
			border-radius: 12px;
			background: rgba(255,255,255,0.04);
			color: rgba(255,255,255,0.8);
			font-size: 14px;
			line-height: 1.7;
		}

		.notice code {
			padding: 1px 6px;
			border-radius: 4px;
			background: rgba(255,255,255,0.1);
			font-size: 13px;
		}

		@media (max-width: 700px) {
			.video-grid,
			.reviews-grid {
				grid-template-columns: 1fr;
			}
		}

		@media (max-width: 540px) {
			body {
				padding: 24px 12px 40px;
			}

			.card {
				padding: 28px 20px;
				border-radius: 16px;
			}

			.header {
				flex-direction: column;
				text-align: center;
				gap: 16px;
			}

			.title h1 {
				font-size: 2rem;
			}

			.tabs {
				justify-content: stretch;
			}

			.tab {
				flex: 1 1 calc(50% - 6px);
			}

			.video-grid {
				gap: 14px;
			}

			.video-frame {
				border-radius: 10px;
			}
		}
	</style>
</head>

<script>

	ICONS.twitter = ICONS.x;

	let site = {};
	let seo = {};
	let tabList = [];
	const loadedTabs = new Set();

	// >> helpers

	// fetches a json file, returns the fallback if it is missing.
	async function fetchJson(path, fallback) {
		try {
			const response = await fetch(path, { cache: 'no-cache' });

			if (!response.ok) {
				return fallback;
			}

			return await response.json();
		} catch (error) {
			return fallback;
		}
	}

	// safely escapes text before inserting it into the page.
	function escapeHtml(value) {
		return String(value ?? '')
			.replace(/&/g, '&amp;')
			.replace(/</g, '&lt;')
			.replace(/>/g, '&gt;')
			.replace(/"/g, '&quot;')
			.replace(/'/g, '&#039;');
	}

	// escapes text, then turns **bold** and [label](url) into html.
	function richText(value) {
		let html = escapeHtml(value);

		html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

		html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (match, label, url) => {
			if (!/^(https?:\/\/|mailto:|\.\/|\/|#)/i.test(url)) {
				return match;
			}

			return `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`;
		});

		return html;
	}

	// makes a path relative to the folder of another file.
	function resolveFrom(base, path) {
		if (!path) {
			return '';
		}

		return new URL(path, new URL(base, window.location.href)).href;
	}

	function fileTitle(name) {
		return String(name).replace(/\.[^/.]+$/, '');
	}

	// >> site (header, theme)

	function ensureFont(font) {
		const family = String(font || '').trim();

		if (!family || family === 'sans-serif') {
			return;
		}

		const url = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family).replace(/%20/g, '+')}:wght@300;400;500;600;700&display=swap`;

		if ([...document.querySelectorAll('link[rel=stylesheet]')].some(link => link.href === url)) {
			return;
		}

		const link = document.createElement('link');
		link.rel = 'stylesheet';
		link.href = url;
		document.head.appendChild(link);
	}

	function applySite() {
		const theme = site.theme || {};
		const root = document.documentElement.style;

		if (theme.backgroundTop) root.setProperty('--bg-top', theme.backgroundTop);
		if (theme.backgroundBottom) root.setProperty('--bg-bottom', theme.backgroundBottom);
		if (theme.cardOpacity !== undefined) root.setProperty('--card-alpha', theme.cardOpacity);
		if (theme.font) root.setProperty('--font', `'${theme.font}'`);

		ensureFont(theme.font);

		const name = site.name || '';
		const pageTitle = seo.pageTitle || (name ? `${name}'s Portfolio` : 'Portfolio');

		document.title = pageTitle;

		const header = document.getElementById('header');
		header.innerHTML = '';

		if (site.avatar) {
			const avatar = document.createElement('img');
			avatar.className = 'avatar';
			avatar.src = site.avatar;
			avatar.alt = name;
			header.appendChild(avatar);
		}

		const title = document.createElement('div');
		title.className = 'title';

		const heading = document.createElement('h1');
		heading.textContent = name;
		title.appendChild(heading);

		if (site.role) {
			const role = document.createElement('div');
			role.className = 'role';
			role.textContent = site.role;
			title.appendChild(role);
		}

		header.appendChild(title);
	}

	// >> tabs

	// the first tab is always the landing tab and has no hash.
	function hashFor(tab, index) {
		if (index === 0) {
			return '';
		}

		return String(tab.hash ?? tab.id).replace(/^#/, '').toLowerCase();
	}

	function buildTabs() {
		const nav = document.getElementById('tabs');
		const sections = document.getElementById('sections');

		nav.innerHTML = '';
		sections.innerHTML = '';

		tabList.forEach(tab => {
			const button = document.createElement('button');
			button.className = 'tab';
			button.dataset.tab = tab.id;
			button.textContent = tab.label || tab.id;
			button.addEventListener('click', () => switchTab(tab.id));
			nav.appendChild(button);

			const section = document.createElement('section');
			section.className = 'tab-content';
			section.id = `tab-${tab.id}`;
			sections.appendChild(section);
		});

		nav.style.display = tabList.length > 1 ? '' : 'none';
	}

	// switches the currently visible portfolio tab.
	function switchTab(tabId, updateHash = true) {
		const index = tabList.findIndex(tab => tab.id === tabId);

		if (index === -1) {
			return;
		}

		document.querySelectorAll('.tab').forEach(button => {
			button.classList.toggle('active', button.dataset.tab === tabId);
		});

		document.querySelectorAll('.tab-content').forEach(section => {
			section.classList.toggle('active', section.id === `tab-${tabId}`);
		});

		loadTab(tabList[index]);

		if (updateHash) {
			const hash = hashFor(tabList[index], index);
			const newHash = hash ? `#${hash}` : '';

			if (window.location.hash !== newHash) {
				history.pushState(null, '', `${window.location.pathname}${window.location.search}${newHash}`);
			}
		}
	}

	function openHashTab() {
		const hash = window.location.hash.replace(/^#/, '').toLowerCase();
		const index = hash ? tabList.findIndex((tab, i) => hashFor(tab, i) === hash) : 0;

		switchTab(tabList[Math.max(index, 0)].id, false);
	}

	// fills a tab the first time it is opened.
	function loadTab(tab) {
		if (loadedTabs.has(tab.id)) {
			return;
		}

		loadedTabs.add(tab.id);

		const section = document.getElementById(`tab-${tab.id}`);

		if (tab.title) {
			const heading = document.createElement('div');
			heading.className = 'section-title';
			heading.textContent = tab.title;
			section.appendChild(heading);
		}

		const body = document.createElement('div');
		section.appendChild(body);

		const loaders = {
			page: loadPage,
			work: loadWork,
			reviews: loadReviews,
			contact: loadContact
		};

		const loader = loaders[tab.type] || loadPage;

		loader(tab, body);
	}

	// >> pages

	// renders a text page from Config/pages/<id>.json.
	async function loadPage(tab, body) {
		const page = await fetchJson(`${CONFIG_DIR}/pages/${tab.id}.json`, null);

		if (!page) {
			body.innerHTML = `<div class="empty">Nothing here yet.</div>`;
			return;
		}

		const wrapper = document.createElement('div');
		wrapper.className = 'page';

		(page.sections || []).forEach(section => {
			if (section.heading) {
				const heading = document.createElement('h2');
				heading.textContent = section.heading;
				wrapper.appendChild(heading);
			}

			[].concat(section.text || []).forEach(paragraph => {
				const p = document.createElement('p');
				p.innerHTML = richText(paragraph);
				wrapper.appendChild(p);
			});

			if (section.items && section.items.length) {
				const list = document.createElement('ul');

				section.items.forEach(item => {
					const li = document.createElement('li');
					li.innerHTML = richText(item);
					list.appendChild(li);
				});

				wrapper.appendChild(list);
			}

			if (section.badge) {
				const badge = document.createElement('div');
				badge.className = 'badge';
				badge.innerHTML = richText(section.badge);
				wrapper.appendChild(badge);
			}
		});

		body.appendChild(wrapper);
	}

	// >> work

	// the github api is only used if Work/index.json is missing and a github repo is set in site.json.
	function githubApi(folder) {
		const github = site.github || {};

		if (!github.owner || !github.repo) {
			return null;
		}

		const branch = github.branch || 'main';

		return {
			list: `https://api.github.com/repos/${github.owner}/${github.repo}/contents/${folder}?ref=${branch}`,
			raw: `https://raw.githubusercontent.com/${github.owner}/${github.repo}/${branch}`
		};
	}

	// gets all files inside the Work folder.
	async function getWorkFiles() {
		const manifest = await fetchJson('Work/index.json', null);

		if (Array.isArray(manifest)) {
			return manifest.map(file => {
				const name = typeof file === 'string' ? file : file.name;

				return {
					name,
					title: typeof file === 'string' ? '' : file.title,
					download_url: (typeof file !== 'string' && file.url) || `Work/${encodeURIComponent(name)}`
				};
			});
		}

		const github = githubApi('Work');

		if (!github) {
			throw new Error('Work/index.json is missing. Open the editor and press Save & Build.');
		}

		const response = await fetch(github.list);

		if (!response.ok) {
			throw new Error('Unable to load the Work folder.');
		}

		return (await response.json()).filter(file => file.type === 'file');
	}

	// creates a work item from a discovered image or video.
	function createWorkItem(file) {
		const item = document.createElement('div');
		item.className = 'work-item';

		const frame = document.createElement('div');
		frame.className = 'video-frame';

		const lowerName = file.name.toLowerCase();

		if (VIDEO_EXTENSIONS.some(type => lowerName.endsWith(type))) {
			const video = document.createElement('video');

			video.src = file.download_url;
			video.controls = true;
			video.muted = true;
			video.playsInline = true;
			video.preload = 'metadata';

			frame.appendChild(video);
		} else if (IMAGE_EXTENSIONS.some(type => lowerName.endsWith(type))) {
			const image = document.createElement('img');

			image.src = file.download_url;
			image.alt = file.title || file.name;
			image.loading = 'lazy';

			frame.appendChild(image);
		} else {
			return null;
		}

		const name = document.createElement('div');
		name.className = 'work-name';
		name.textContent = file.title || fileTitle(file.name);

		item.appendChild(frame);
		item.appendChild(name);

		return item;
	}

	// loads all proof of work media.
	async function loadWork(tab, body) {
		body.className = 'video-grid';
		body.innerHTML = '<div class="loading grid-message">Loading work...</div>';

		try {
			const files = await getWorkFiles();
			const items = files.map(createWorkItem).filter(Boolean);

			body.innerHTML = '';

			if (!items.length) {
				body.innerHTML = '<div class="empty grid-message">No proof of work has been added yet.</div>';
				return;
			}

			items.forEach(item => body.appendChild(item));
		} catch (error) {
			console.error(error);
			loadedTabs.delete(tab.id);
			body.innerHTML = `<div class="empty grid-message">${escapeHtml(error.message || 'Unable to load proof of work.')}</div>`;
		}
	}

	// >> reviews

	// gets the list of review folders.
	async function getReviewFiles() {
		const manifest = await fetchJson('Reviews/index.json', null);

		if (Array.isArray(manifest)) {
			return manifest.map(entry => ({
				name: typeof entry === 'string' ? entry : entry.name,
				download_url: `Reviews/${encodeURIComponent(typeof entry === 'string' ? entry : entry.name)}/index.json`
			}));
		}

		const github = githubApi('Reviews');

		if (!github) {
			throw new Error('Reviews/index.json is missing. Open the editor and press Save & Build.');
		}

		const response = await fetch(github.list);

		if (!response.ok) {
			throw new Error('Unable to load the Reviews folder.');
		}

		return (await response.json())
			.filter(entry => entry.type === 'dir')
			.map(client => ({
				name: client.name,
				download_url: `${github.raw}/Reviews/${encodeURIComponent(client.name)}/index.json`
			}));
	}

	// creates a review card from json data.
	function createReview(review) {
		const card = document.createElement('article');
		card.className = 'review';

		const pfp = escapeHtml(review.pfp || '');
		const name = escapeHtml(review.name || 'Anonymous');
		const text = escapeHtml(review.text || '');
		const proof = review.proof || '';

		card.innerHTML = `
			<div class="review-header">
				${pfp ? `<img class="review-pfp" src="${pfp}" alt="${name}" loading="lazy">` : '<div class="review-pfp"></div>'}
			</div>

			<div class="review-content">
				<div class="review-name">${name}</div>
				<div class="review-text">${text}</div>

				${proof ? `
					<button class="proof-button" type="button">Show Proof</button>

					<div class="review-proof">
						<img src="${escapeHtml(proof)}" alt="Proof from ${name}" loading="lazy">
					</div>
				` : ''}
			</div>
		`;

		const proofButton = card.querySelector('.proof-button');
		const proofContainer = card.querySelector('.review-proof');

		if (proofButton && proofContainer) {
			proofButton.addEventListener('click', () => {
				const visible = proofContainer.classList.toggle('visible');

				proofButton.textContent = visible ? 'Hide Proof' : 'Show Proof';
			});
		}

		return card;
	}

	// loads review json files.
	async function loadReviews(tab, body) {
		body.className = 'reviews-grid';
		body.innerHTML = '<div class="loading grid-message">Loading reviews...</div>';

		try {
			const files = await getReviewFiles();

			const reviews = await Promise.all(
				files.map(async file => {
					const review = await fetchJson(file.download_url, null);

					if (!review) {
						return null;
					}

					// pfp and proof are relative to the review's own folder.
					review.pfp = resolveFrom(file.download_url, review.pfp);
					review.proof = resolveFrom(file.download_url, review.proof);

					return review;
				})
			);

			body.innerHTML = '';

			const valid = reviews.filter(Boolean);

			if (!valid.length) {
				body.innerHTML = '<div class="empty grid-message">No reviews have been added yet.</div>';
				return;
			}

			valid.forEach(review => body.appendChild(createReview(review)));
		} catch (error) {
			console.error('Failed to load reviews:', error);
			loadedTabs.delete(tab.id);
			body.innerHTML = `<div class="empty grid-message">${escapeHtml(error.message || 'Unable to load reviews.')}</div>`;
		}
	}

	// >> contact

	// loads the contact links from Config/contact.json.
	async function loadContact(tab, body) {
		const contacts = await fetchJson(`${CONFIG_DIR}/contact.json`, []);

		if (!contacts.length) {
			body.innerHTML = '<div class="empty">No contact links have been added yet.</div>';
			return;
		}

		const list = document.createElement('div');
		list.className = 'contact-items';

		contacts.forEach(contact => {
			const link = document.createElement('a');
			link.className = 'contact-item';
			link.href = contact.url || '#';
			link.target = '_blank';
			link.rel = 'noopener noreferrer';

			const icon = contact.icon || 'link';

			if (ICONS[icon]) {
				link.innerHTML = `
					<svg width="22" height="22" viewBox="0 0 24 24" fill="white">
						<path d="${ICONS[icon]}"/>
					</svg>
				`;
			} else {
				const image = document.createElement('img');
				image.className = 'contact-icon';
				image.src = icon;
				image.alt = '';
				link.appendChild(image);
			}

			link.appendChild(document.createTextNode(contact.label || contact.url || ''));
			list.appendChild(link);
		});

		body.appendChild(list);
	}

	// >> start

	function showSetupNotice() {
		const onFile = window.location.protocol === 'file:';

		document.getElementById('sections').innerHTML = `
			<div class="notice">
				<strong>The site could not load its settings.</strong><br>
				${onFile
					? 'This page was opened straight from the file system, which browsers block. Start the test server instead: run <code>editor.py</code> and press <em>Start Server</em>, or run <code>python main.py</code>.'
					: 'Config/site.json was not found. Make sure the Config folder is uploaded next to index.html.'}
			</div>
		`;
	}

	async function init() {
		const [siteData, seoData, tabData] = await Promise.all([
			fetchJson(`${CONFIG_DIR}/site.json`, null),
			fetchJson(`${CONFIG_DIR}/seo.json`, {}),
			fetchJson(`${CONFIG_DIR}/tabs.json`, null)
		]);

		if (!siteData || !Array.isArray(tabData)) {
			showSetupNotice();
			return;
		}

		site = siteData;
		seo = seoData || {};
		tabList = tabData.filter(tab => tab.enabled !== false && tab.id);

		if (!tabList.length) {
			tabList = [{ id: 'home', label: 'Home', type: 'page' }];
		}

		applySite();
		buildTabs();
		openHashTab();
	}

	window.addEventListener('hashchange', () => {
		if (tabList.length) {
			openHashTab();
		}
	});

	init();
</script>
</body>
</html>
